<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithmics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: false},
        {left: '$', right: '$', display: false}
      ]
    });"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <script src="../nav.js"></script>

  <main>
  </main>

  <script>
    function setLang(lang) {
      localStorage.setItem('lang', lang);
      document.querySelectorAll('[data-en][data-fr]').forEach(el => {
        el.innerHTML = el.getAttribute('data-' + lang);
      });
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
      document.documentElement.lang = lang;
    }

    // Wrap proof content in .proof-body for white-space: pre-line
    document.querySelectorAll('.proof').forEach(function(el) {
      var summary = el.querySelector('summary');
      var wrapper = document.createElement('div');
      wrapper.className = 'proof-body';
      while (summary.nextSibling) wrapper.appendChild(summary.nextSibling);
      // Trim leading newline from first text node
      var first = wrapper.firstChild;
      if (first && first.nodeType === 3) {
        first.textContent = first.textContent.replace(/^\s*\n\s*/, '');
      }
      el.appendChild(wrapper);
    });

    // Apply saved preference on load
    (function() {
      var lang = localStorage.getItem('lang') || 'en';
      if (lang === 'fr') setLang('fr');
    })();
  </script>
</body>
</html>
