<!doctype html><meta charset=utf-8>
<script>try{localStorage.setItem('theme','dark')}catch(e){}</script>
<iframe id=f src="cs/algorithmics.html" style="width:1000px;height:600px;border:0"></iframe>
<pre id=out>...</pre>
<script>
document.getElementById('f').addEventListener('load',function(){
 var d=this.contentDocument;
 var pre=d.querySelector('pre'); var code=pre&&pre.querySelector('code');
 var tok=d.querySelector('.token.keyword');
 document.getElementById('out').textContent=JSON.stringify({
   preBg:getComputedStyle(pre).backgroundColor,
   codeBg:code?getComputedStyle(code).backgroundColor:'n/a',
   codeColor:code?getComputedStyle(code).color:'n/a',
   tokColor:tok?getComputedStyle(tok).color:'n/a',
   preClass:pre.className, codeClass:code?code.className:'n/a'
 });
});
</script>
