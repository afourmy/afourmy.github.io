<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: false},
        {left: '$', right: '$', display: false}
      ]
    });"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script src="nav.js"></script>

  <main>
    <h1>Welcome</h1>

    <p>
      This site is a collection of personal notes on mathematics, computer science, and networking. It is not intended as a reference and may contain mistakes.
    </p>

  </main>

  <script>
    function setLang(lang) {
      localStorage.setItem('lang', lang);
      document.querySelectorAll('[data-en][data-fr]').forEach(el => {
        el.innerHTML = el.getAttribute('data-' + lang);
      });
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
      document.documentElement.lang = lang;
    }

    // Apply saved preference on load
    (function() {
      var lang = localStorage.getItem('lang') || 'en';
      if (lang === 'fr') setLang('fr');
    })();

    // ── SPA routing ──
    function renderMath() {
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.querySelector('main'), {
          delimiters: [
            {left: '$$', right: '$$', display: false},
            {left: '$', right: '$', display: false}
          ]
        });
      }
    }

    async function navigateTo(url, pushState) {
      try {
        var resp = await fetch(url);
        if (!resp.ok) { window.location.href = url; return; }
        var html = await resp.text();
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var newMain = doc.querySelector('main');
        if (!newMain) { window.location.href = url; return; }
        document.querySelector('main').innerHTML = newMain.innerHTML;
        if (pushState !== false) {
          history.pushState(null, '', url);
        }
        document.title = doc.title || 'Home';
        renderMath();
        var lang = localStorage.getItem('lang') || 'en';
        setLang(lang);
        window.scrollTo(0, 0);
      } catch (e) {
        window.location.href = url;
      }
    }

    // Base URL for resolving nav links (always relative to index.html location)
    var baseUrl = new URL('./', window.location.href).href;

    document.addEventListener('click', function(e) {
      var link = e.target.closest('a[href]');
      if (!link) return;
      var href = link.getAttribute('href');
      if (!href || href === '#' || href.startsWith('http') || href.startsWith('mailto:')) return;
      if (!href.endsWith('.html')) return;
      e.preventDefault();
      var resolved = new URL(href, baseUrl).href;
      navigateTo(resolved);
    });

    window.addEventListener('popstate', function() {
      navigateTo(window.location.href, false);
    });
  </script>
</body>
</html>
